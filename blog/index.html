---
layout: default
title: Blog
---

<div class="blog-page">

    <h1>Blog</h1>

    {% for post in site.posts %}
    <article class="post-preview">

        <h2>
            <a href="{{ post.url }}">{{ post.title }}</a>
        </h2>

        <p class="post-date">
            {{ post.date | date: "%B %-d, %Y" }}
        </p>

        {{ post.excerpt }}

    </article>
    {% endfor %}

</div>
